name: Android 7 runtime acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.*'
      - 'tool/android_runtime_smoke.py'
      - 'integration_test/android_clear_playlist_test.dart'
      - '.github/workflows/android-runtime.yml'
permissions:
  contents: read
concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Flutter and build isolated debug APK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter pub get --no-example
          flutter build apk --debug --target-platform android-x64
      - name: Enable KVM for the task-owned emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export Flutter for integration acceptance
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Launch actual app and verify JavaScript engine on Android 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            python tool/android_runtime_smoke.py
            adb -e shell pm grant com.example.nazzelha android.permission.WRITE_EXTERNAL_STORAGE
            flutter test integration_test/android_clear_playlist_test.dart -d emulator-5554 --dart-define=ANDROID_CI_ISOLATED=true
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-7-runtime-evidence
          path: build/android-runtime-smoke/
          if-no-files-found: warn
          retention-days: 14
