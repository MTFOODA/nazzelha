# App icon configuration generated for Nazzelha.
# Source image: assets/logo/nazzelha-v2.png (single source of truth).
# Run `dart run flutter_launcher_icons` to regenerate icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/nazzelha-v2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1018B8"
  adaptive_icon_foreground: "assets/logo/nazzelha-v2.png"
  web:
    generate: true
    image_path: "assets/logo/nazzelha-v2.png"
    background_color: "#F8FAFC"
    theme_color: "#2563EB"
  windows:
    generate: true
    image_path: "assets/logo/nazzelha-v2.png"
    icon_size: 256